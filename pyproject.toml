[project]
name = "iki-web"
version = "0.1.0"
description = "Sitio web de IKI | Diseño & Construcción"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # orden de imports
    "B",             # bugbear
    "UP",            # pyupgrade
    "C4",            # comprehensions
    "SIM",           # simplificaciones
    "DJ",            # buenas prácticas de Django
    "S",             # seguridad (flake8-bandit) — obligatorio
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert en tests
    "S105",  # strings de prueba que parecen contraseñas
    "S603",  # subprocess sin shell, con argumentos controlados
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests", "apps"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
